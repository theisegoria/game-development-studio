name: Windows package fsync

on:
  pull_request:
    paths:
      - 'src/packages/**'
      - 'tests/package-directory-fsync.test.ts'
      - 'tests/helpers/model-fixture.ts'
      - 'package*.json'
      - '.github/workflows/windows-package-fsync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-fsync:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify native package creation and directory error handling
        run: npx vitest run tests/package-directory-fsync.test.ts tests/asset-packages.test.ts
