name: Windows package fsync

on:
  workflow_call:
  pull_request:
    paths:
      - 'src/packages/**'
      - 'tests/package-directory-fsync.test.ts'
      - 'tests/helpers/model-fixture.ts'
      - 'package*.json'
      - '.github/workflows/windows-package-fsync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-fsync:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify native package creation and directory error handling
        run: npx vitest run tests/package-directory-fsync.test.ts tests/asset-packages.test.ts
