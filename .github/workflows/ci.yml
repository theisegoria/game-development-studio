name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      # The closed direct Node runtime stages a Mach-O library closure and is
      # deliberately macOS-only. Its dedicated test runs in macos-app below;
      # the Ubuntu matrix continues to cover every cross-platform test.
      - name: Run cross-platform TypeScript tests
        run: npm test -- --exclude tests/cli-runtime-payload.test.ts --no-file-parallelism
      - run: npm run verify

      - name: Audit the publish roster
        run: npm pack --dry-run --json

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version | head -1

      - name: Refuse to continue if Blender is not discoverable
        run: |
          node -e "
          import('./dist/util/blender.js').then(({ findBlender }) => {
            const found = findBlender();
            if (!found) {
              console.error('Blender not discoverable - gated tests would skip');
              process.exit(1);
            }
            console.log('Blender discovered at ' + found);
          });
          "

      - name: Prove Blender can import glTF
        run: >-
          blender --background --factory-startup
          --python-expr "import bpy, numpy; bpy.ops.import_scene.gltf; print('glTF importer and numpy are available')"

      - name: Run the Blender-backed tests
        run: npx vitest run tests/normalize.test.ts

      - name: Prove the Blender-gated tests actually ran
        run: |
          npx vitest run tests/normalize.test.ts --reporter=json --outputFile=blender-results.json
          node .github/scripts/assert-blender-tests-ran.mjs blender-results.json

  macos-app:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '25.2.1'
          cache: npm

      - name: Install Node build dependencies
        run: npm ci

      # This is the admissible platform for the direct runtime's Mach-O
      # closure. Do not turn it into a Linux skip without this macOS gate.
      - name: Run macOS-only closed CLI runtime payload tests
        run: npm run test:runtime

      - name: Report the native toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Audit binary-only release packager fixtures
        run: ./script/package_macos_release.sh self-test

      - name: Build the macOS 26 app
        run: swift build --package-path apps/macos/GameDevelopmentStudio

      - name: Test the app model, process boundary, and credential boundary
        run: swift test --package-path apps/macos/GameDevelopmentStudio

      - name: Fetch the checksum-pinned upstream Node runtime
        run: |
          profile=distribution/macos-ci-upstream-node/THIRD_PARTY_PROVENANCE.json
          runtime_url="$(node -p "require('./$profile').bundledRuntime.node.sourceArtifact.url")"
          runtime_sha="$(node -p "require('./$profile').bundledRuntime.node.sourceArtifact.sha256")"
          runtime_dir="$RUNNER_TEMP/gds-upstream-node"
          mkdir -p "$runtime_dir"
          curl --fail --location --retry 3 "$runtime_url" -o "$runtime_dir/node.tar.gz"
          printf '%s  %s\n' "$runtime_sha" "$runtime_dir/node.tar.gz" | shasum -a 256 --check
          tar -xzf "$runtime_dir/node.tar.gz" -C "$runtime_dir" node-v25.2.1-darwin-arm64/bin/node node-v25.2.1-darwin-arm64/LICENSE
          cmp "$runtime_dir/node-v25.2.1-darwin-arm64/LICENSE" distribution/macos-ci-upstream-node/legal/third-party-licenses/node-25.2.1-LICENSE.txt
          echo "GAME_DEV_NODE_EXECUTABLE=$runtime_dir/node-v25.2.1-darwin-arm64/bin/node" >> "$GITHUB_ENV"

      - name: Stage and ad-hoc sign the local app bundle
        env:
          GAME_DEV_RUNTIME_PROFILE: upstream-node-ci
        run: ./script/build_and_run.sh --build-only

      - name: Validate the staged bundle
        run: |
          plutil -lint apps/macos/GameDevelopmentStudio/dist/GameDevelopmentStudio.app/Contents/Info.plist
          codesign --verify --deep --strict apps/macos/GameDevelopmentStudio/dist/GameDevelopmentStudio.app
