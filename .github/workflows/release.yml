name: Release artifacts

# Builds verified artifacts only. Publication is a separate, authorized action.
# npm registry publication is unavailable until an existing authenticated
# publisher is configured; this workflow never creates or requests credentials.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-checks:
    uses: ./.github/workflows/ci.yml
  windows-install:
    uses: ./.github/workflows/windows-install.yml
  windows-packages:
    uses: ./.github/workflows/windows-package-fsync.yml

  build-artifacts:
    needs: [platform-checks, windows-install, windows-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Validate release identity
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo 'Version tag does not match package.json' >&2
            exit 1
          fi
          grep -Fx "## $version" CHANGELOG.md
          npx vitest run tests/version-parity.test.ts --no-file-parallelism
      - name: Verify installed package and build release artifacts
        run: |
          npm run verify
          assets="$RUNNER_TEMP/game-dev-release-assets"
          export_tree="$RUNNER_TEMP/game-dev-release-skills"
          mkdir -p "$assets"
          version="$(node -p "require('./package.json').version")"
          npm pack --ignore-scripts --pack-destination "$assets"
          node scripts/build-skills-repository.mjs "$export_tree"
          python3 "$export_tree/scripts/verify.py"
          python3 "$export_tree/scripts/build_release.py" "$assets/game-development-studio-plugin-$version.zip"
          cd "$assets"
          sha256sum *.tgz *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-development-studio-${{ github.sha }}
          path: ${{ runner.temp }}/game-dev-release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-windows-artifact:
    needs: build-artifacts
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: game-development-studio-${{ github.sha }}
          path: release-artifacts
      - name: Verify checksums and install the actual release tarball
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($line in Get-Content release-artifacts/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$') { throw 'Invalid checksum record' }
            $digest = $Matches[1]
            $file = Join-Path release-artifacts $Matches[2]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $digest) { throw "Checksum mismatch: $file" }
          }
          $tarball = (Resolve-Path "release-artifacts/theisegoria-game-development-studio-$version.tgz").Path
          $prefix = Join-Path $env:RUNNER_TEMP 'Release CLI with spaces'
          npm.cmd install --global --prefix "$prefix" --ignore-scripts "$tarball"
          if ($LASTEXITCODE -ne 0) { throw 'Release tarball install failed' }
          $env:Path = "$prefix;$env:Path"
          Set-Location $env:RUNNER_TEMP
          $actualVersion = game-dev.cmd --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Trim() -ne $version) { throw 'Installed version mismatch' }
          $workspace = Join-Path $env:RUNNER_TEMP 'Release smoke workspace'
          foreach ($command in @('capabilities', 'doctor')) {
            $output = game-dev.cmd $command --output-dir "$workspace" --json
            if ($LASTEXITCODE -ne 0) { throw "$command failed" }
            $result = $output | ConvertFrom-Json
            if ($result.schema -ne 'game_dev.result.v1' -or $result.operation -ne $command -or $result.ok -ne $true -or $result.data.version -ne $version) { throw "Unexpected $command response" }
          }
