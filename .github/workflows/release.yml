name: Release artifacts

# Builds verified artifacts only. Publication is a separate, authorized action.
# npm registry publication is unavailable until an existing authenticated
# publisher is configured; this workflow never creates or requests credentials.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-checks:
    uses: ./.github/workflows/ci.yml
  windows-install:
    uses: ./.github/workflows/windows-install.yml
  windows-packages:
    uses: ./.github/workflows/windows-package-fsync.yml
  native-archive:
    uses: ./.github/workflows/anvil-archive.yml
  texture-compression:
    uses: ./.github/workflows/basis.yml
  convex-decomposition:
    uses: ./.github/workflows/coacd.yml

  build-artifacts:
    needs: [platform-checks, windows-install, windows-packages, native-archive, texture-compression, convex-decomposition]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Retrieve verified native archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: anvil-native-${{ github.sha }}
          path: ${{ runner.temp }}/game-dev-release-assets
      - name: Validate release identity
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo 'Version tag does not match package.json' >&2
            exit 1
          fi
          grep -Fx "## $version" CHANGELOG.md
          npx vitest run tests/version-parity.test.ts --no-file-parallelism
          node --input-type=module - "$RUNNER_TEMP/game-dev-release-assets" "$version" "$GITHUB_SHA" <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          import { createReadStream } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          import path from 'node:path';
          const [directory, version, revision] = process.argv.slice(2);
          const metadata = JSON.parse(await readFile(path.join(directory, 'ANVIL_RELEASE.json'), 'utf8'));
          const name = `Anvil-${version}-macos-arm64.zip`;
          assert.equal(metadata.schema, 'game_dev.anvil_release.v1');
          assert.equal(metadata.repository, 'theisegoria/game-development-studio');
          assert.equal(metadata.version, version);
          assert.equal(metadata.sourceRevision, revision);
          assert.equal(metadata.artifact, name);
          assert.equal(metadata.signing.kind, 'ad-hoc');
          assert.equal(metadata.signing.notarized, false);
          const file = path.join(directory, name), digest = createHash('sha256');
          for await (const chunk of createReadStream(file)) digest.update(chunk);
          assert.equal(metadata.sha256, digest.digest('hex'));
          assert.equal(metadata.bytes, (await stat(file)).size);
          NODE
      - name: Verify installed package and build release artifacts
        run: |
          npm run verify
          assets="$RUNNER_TEMP/game-dev-release-assets"
          export_tree="$RUNNER_TEMP/game-dev-release-skills"
          mkdir -p "$assets"
          version="$(node -p "require('./package.json').version")"
          npm pack --ignore-scripts --pack-destination "$assets"
          node scripts/build-skills-repository.mjs "$export_tree"
          python3 "$export_tree/scripts/verify.py"
          python3 "$export_tree/scripts/build_release.py" "$assets/game-development-studio-plugin-$version.zip"
          cd "$assets"
          sha256sum *.tgz *.zip ANVIL_RELEASE.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-development-studio-${{ github.sha }}
          path: ${{ runner.temp }}/game-dev-release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-release-artifact:
    needs: build-artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: game-development-studio-${{ github.sha }}
          path: release-artifacts
      - name: Verify the release artifact with public baseline, upgrade, rollback and reinstall
        id: unix-release-acceptance
        if: runner.os != 'Windows'
        shell: bash
        env:
          GDS_RELEASE_API_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/verify-release-rollback.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const [workspace, runnerTemp] = process.argv.slice(2);
          const sourcePackage = JSON.parse(await readFile(path.join(workspace, 'package.json'), 'utf8'));
          const targetVersion = sourcePackage.version;
          assert.match(targetVersion, /^\d+\.\d+\.\d+$/, 'Invalid source package version');
          const { fetchPublishedRelease } = await import(pathToFileURL(path.join(workspace, 'scripts/verify-published-first-run.mjs')));
          const { verifyFirstRun } = await import(pathToFileURL(path.join(workspace, 'scripts/verify-first-run.mjs')));
          assert(process.env.GDS_RELEASE_API_TOKEN, 'Read-only GitHub token is unavailable for the public baseline');
          const previous = await fetchPublishedRelease('1.3.1', globalThis.fetch, process.env.GDS_RELEASE_API_TOKEN);
          assert.equal(previous.version, '1.3.1', 'Public rollback baseline version mismatch');
          const root = await mkdtemp(path.join(runnerTemp, 'gds release baseline '));
          try {
            const previousArtifact = path.join(root, previous.name);
            const previousChecksums = path.join(root, 'previous SHA256SUMS.txt');
            const previousMetadata = path.join(root, 'previous release.json');
            await Promise.all([
              writeFile(previousArtifact, previous.artifactBytes, { flag: 'wx' }),
              writeFile(previousChecksums, previous.manifestBytes, { flag: 'wx' }),
              writeFile(previousMetadata, JSON.stringify(previous.release), { flag: 'wx' }),
            ]);
            const artifact = path.join(workspace, 'release-artifacts', `theisegoria-game-development-studio-${targetVersion}.tgz`);
            const checksums = path.join(workspace, 'release-artifacts', 'SHA256SUMS.txt');
            const reportPath = path.join(runnerTemp, 'game-dev-release-rollback.json');
            const execution = await verifyFirstRun({
              artifact,
              checksums,
              'previous-artifact': previousArtifact,
              'previous-checksums': previousChecksums,
              'previous-release-metadata': previousMetadata,
              report: reportPath,
            });
            assert.equal(execution.version, targetVersion, 'Built tarball version differs from package.json');
            assert.equal(execution.rollback?.from, '1.3.1', 'Public rollback baseline mismatch');
            assert.equal(execution.rollback?.to, targetVersion, 'Rollback target differs from package.json');
            assert.equal(execution.rollback?.verified, true, 'Upgrade, rollback and reinstall stages did not complete');
            console.log(JSON.stringify({
              schema: 'game_dev.release_artifact_rollback_verification.v1',
              platform: process.platform,
              arch: process.arch,
              node: process.version,
              target: { version: execution.version, sha256: execution.sha256, integrity: execution.integrity },
              previous: { version: previous.version, sha256: previous.verification.sha256, integrity: previous.verification.integrity },
              execution,
            }, null, 2));
          } finally {
            await rm(root, { recursive: true, force: true });
          }
          NODE
          npm exec -- node "$RUNNER_TEMP/verify-release-rollback.mjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Install and verify the exact built release tarball
        id: windows-release-acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the source package version' }
          $artifact = "release-artifacts/theisegoria-game-development-studio-$version.tgz"
          npm.cmd exec -- node scripts/verify-first-run.mjs --artifact $artifact --checksums release-artifacts/SHA256SUMS.txt --report "$env:RUNNER_TEMP\game-dev-release-first-run.json"
          if ($LASTEXITCODE -ne 0) { throw 'Installed release first-run verification failed' }
      - name: Upload Windows release first-run report
        if: ${{ always() && steps.windows-release-acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-first-run-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/game-dev-release-first-run.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Unix release and rollback report
        if: ${{ always() && steps.unix-release-acceptance.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rollback-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/game-dev-release-rollback.json
          if-no-files-found: error
          retention-days: 14
