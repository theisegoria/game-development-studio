name: Basis CPU verification
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/production/**'
      - 'src/inspection/**'
      - 'src/packages/**'
      - 'tests/texture-compression*'
      - 'scripts/*basis*'
      - 'scripts/verify-texture-compression.mjs'
      - '.github/workflows/basis.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  basis-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build pinned encoder without OpenCL
        run: node scripts/build-basis-cpu.mjs "${{ runner.temp }}/gds-basis-cpu"
      - name: Encode, transcode, inspect and package synthetic textures on CPU
        run: node scripts/verify-texture-compression.mjs "${{ runner.temp }}/gds-basis-cpu/basis-cpu.json"
